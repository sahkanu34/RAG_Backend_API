version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=
    healthcheck:
      # FIX: /dashboard is the UI page, not a health endpoint, and the
      # qdrant image doesn't ship curl anyway. Qdrant's actual REST API
      # root responds 200 with version info, so just hit "/". Using a
      # plain TCP check via bash avoids needing curl/wget in the image.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis for Chat Memory
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # RedisInsight - GUI for browsing Redis (sessions, messages, TTLs)
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  qdrant_storage:
  redis_storage:
  redisinsight_data:

networks:
  default:
    name: rag_network